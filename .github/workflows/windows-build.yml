name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - signing_tool.py
      - requirements.txt
      - rules.json
      - phrases.json
      - .github/workflows/windows-build.yml

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: python -m PyInstaller --onefile --noconsole --name SigningHelper --collect-all winocr signing_tool.py
      - name: Package clean distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force share | Out-Null
          Copy-Item dist/SigningHelper.exe share/
          Copy-Item rules.json,phrases.json share/
          Compress-Archive -Path share -DestinationPath signing-helper-windows.zip
          Get-FileHash signing-helper-windows.zip -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: signing-helper-windows
          path: signing-helper-windows.zip
          retention-days: 30
